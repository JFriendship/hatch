services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - huggingface_cache:/home/appuser/.cache/huggingface
    environment:
      - PYTHONUNBUFFERED=1
    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000


  frontend:
    build:
      context:  ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
    - ./frontend:/app
    - /app/node_modules

volumes:
  huggingface_cache: